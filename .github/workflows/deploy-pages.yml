name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "app/src/main/assets/**"
      - "docs/**"
      - "sync_web_assets.ps1"
      - "version.properties"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/verify-apk.yml"
      - "scripts/**"
      - "tests/android-release-checks.ps1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-release:
    uses: ./.github/workflows/verify-apk.yml
    permissions:
      contents: read

  deploy:
    needs: verify-release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Sync docs from assets
        shell: pwsh
        run: ./sync_web_assets.ps1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
