name: Verify Capability MCP
on:
  push:
    branches: [main]
    paths: ['mcp-capabilities/**', '.github/workflows/verify-mcp.yml']
  pull_request:
    paths: ['mcp-capabilities/**', '.github/workflows/verify-mcp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        working-directory: mcp-capabilities
